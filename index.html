<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porta Makro</title>
<meta name="description" content="Controle da porta de enrolar da Makro Boutique">
<meta name="theme-color" content="#14181c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Porta Makro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login (só no modo real) -->
<section id="login" hidden>
  <form id="formLogin" autocomplete="on">
    <h1>Porta da Makro Boutique</h1>
    <label>E-mail <input id="email" type="email" autocomplete="username" required></label>
    <label>Senha <input id="senha" type="password" autocomplete="current-password" required></label>
    <p id="erroLogin" class="erro" role="alert"></p>
    <button class="primario" type="submit">Entrar</button>
    <button class="link" type="button" id="irSim">Ver em modo simulação</button>
  </form>
</section>

<main id="app" hidden>
  <div id="faixaSim" class="faixa-sim" hidden>MODO SIMULAÇÃO — nada está ligado à porta real</div>

  <header>
    <h1>Porta da Makro Boutique</h1>
    <button id="btnMenu" class="icone" aria-label="Ajustes">⚙</button>
  </header>

  <section class="cartao porta-cartao" aria-label="Porta">
    <svg id="porta" viewBox="0 0 300 250" role="img" aria-label="Desenho da porta de enrolar">
      <defs>
        <clipPath id="vao"><rect x="30" y="40" width="240" height="190"/></clipPath>
        <pattern id="ripas" width="10" height="12" patternUnits="userSpaceOnUse">
          <rect width="10" height="12" fill="var(--lamina)"/>
          <rect y="10" width="10" height="2" fill="var(--lamina-sombra)"/>
        </pattern>
        <pattern id="incerta" width="10" height="12" patternUnits="userSpaceOnUse">
          <rect width="10" height="12" fill="var(--lamina)" opacity=".45"/>
          <rect y="10" width="10" height="2" fill="var(--lamina-sombra)" opacity=".6"/>
        </pattern>
      </defs>
      <rect x="10" y="10" width="280" height="230" rx="6" class="parede"/>
      <rect x="30" y="40" width="240" height="190" class="vao"/>
      <g clip-path="url(#vao)">
        <rect id="lamina" x="30" y="40" width="240" height="190" fill="url(#ripas)"/>
        <rect id="barra" x="30" y="226" width="240" height="8" class="barra"/>
      </g>
      <rect x="22" y="14" width="256" height="30" rx="4" class="caixa"/>
      <text x="150" y="34" text-anchor="middle" class="caixa-txt">PORTA DE ENROLAR</text>
      <text id="interrog" x="150" y="150" text-anchor="middle" class="interrog" hidden>?</text>
    </svg>
    <div class="pct-linha"><span id="pctTxt">—</span></div>
  </section>

  <section class="cartao estado" aria-live="polite">
    <div id="rotulo" class="rotulo">—</div>
    <div id="sub" class="sub"></div>
    <div id="aviso" class="aviso" hidden></div>
    <div id="retorno" class="retorno"></div>
  </section>

  <section class="cartao conexao">
    <span id="ponto" class="ponto"></span>
    <span id="conTxt">Conectando…</span>
    <span id="atualizadoTxt" class="atualizado"></span>
  </section>

  <section class="cartao" id="blocoPush">
    <button id="btnPush" class="secundario">Ativar notificações</button>
    <p id="pushMsg" class="dica"></p>
  </section>

  <section class="cartao" id="blocoSim" hidden>
    <h2>Bancada (simulação)</h2>
    <label class="linha"><input type="checkbox" id="simAuto"> Sensores seguem a porta virtual</label>
    <label class="linha"><input type="checkbox" id="simAberto"> Sensor de porta ABERTA</label>
    <label class="linha"><input type="checkbox" id="simFechado"> Sensor de porta FECHADA</label>
    <div class="grupo-btn">
      <span class="dica">Controle externo (sem fio / botoeira):</span>
      <button class="mini" data-ext="abrir">Abrir</button>
      <button class="mini" data-ext="parar">Parar</button>
      <button class="mini" data-ext="fechar">Fechar</button>
    </div>
    <label class="linha"><input type="checkbox" id="simOffline"> Cortar comunicação do ESP32</label>
    <button class="mini" id="simReiniciar">Reiniciar ESP32</button>
  </section>

  <section class="cartao">
    <h2>Histórico</h2>
    <ul id="historico" class="historico"><li class="vazio">Sem eventos ainda.</li></ul>
  </section>

  <div class="espaco-barra"></div>
</main>

<nav id="barra-cmd" class="barra-cmd" hidden aria-label="Comandos da porta">
  <button class="cmd abrir" data-cmd="abrir">Abrir</button>
  <button class="cmd parar" data-cmd="parar">Parar</button>
  <button class="cmd fechar" data-cmd="fechar">Fechar</button>
</nav>

<dialog id="menu">
  <form method="dialog">
    <h2>Ajustes</h2>
    <p id="menuUsuario" class="dica"></p>
    <label>Tempo para abrir (s) <input id="cfgAbrir" type="number" min="3" max="120" step="0.5"></label>
    <label>Tempo para fechar (s) <input id="cfgFechar" type="number" min="3" max="120" step="0.5"></label>
    <label>Duração do pulso (ms) <input id="cfgPulso" type="number" min="100" max="2000" step="50"></label>
    <p class="dica">Os tempos só afetam a animação. O pulso é enviado ao ESP32.</p>
    <div class="grupo-btn">
      <button class="secundario" value="salvar" id="cfgSalvar">Salvar</button>
      <button class="link" id="btnTrocarModo" type="button"></button>
      <button class="link" id="btnSair" type="button">Sair da conta</button>
      <button class="link" value="fechar">Fechar</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
